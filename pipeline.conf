# pipeline.conf: settings shared by deploy.sh and health.sh.
# Change them here, not in the scripts or the server's source code.
HOST=127.0.0.1
PORT=2121
FTP_USER=student
FTP_PASS=exam477
# Manage Service Interactions, compatibility: 1 = keep clients built before v5 (e.g. the
# M0 JFTP, which sends PASV and waits for a 227 reply) working against a server that
# otherwise speaks only the modern 229 dialect. deploy.sh passes --legacy-pasv to any
# tagged server that supports it. Set to 0 only when you accept dropping those clients.
LEGACY_PASV=1
DEPLOY="$HOME/jftp-deploy"   # deployed versions and uploads live here, outside the repo
